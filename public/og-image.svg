<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1A18" />
  
  <!-- Subtle Gradient Accent -->
  <defs>
    <radialGradient id="accent" cx="100%" cy="0%" r="100%" fx="100%" fy="0%">
      <stop offset="0%" stop-color="#863bff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1A1A18" stop-opacity="0" />
    </radialGradient>
    
    <!-- Logo Path from favicon.svg -->
    <path id="logoPath" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0-3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
  </defs>
  
  <rect width="1200" height="630" fill="url(#accent)" />
  
  <!-- Content Container -->
  <g transform="translate(100, 150)">
    <!-- Logo -->
    <g transform="scale(3) translate(0, 0)">
       <use href="#logoPath" fill="#863bff" />
    </g>
    
    <!-- Company Name -->
    <text x="160" y="85" font-family="Arial, sans-serif" font-weight="bold" font-size="84" fill="#FFFFFF">Tabranitect</text>
    
    <!-- Tagline -->
    <text x="0" y="240" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">Jasa Konstruksi Profesional</text>
    <text x="0" y="310" font-family="Arial, sans-serif" font-size="32" fill="#ede6ff" fill-opacity="0.8">25+ Tahun Pengalaman Membangun Indonesia</text>
    
    <!-- Decorative Line -->
    <rect x="0" y="180" width="800" height="4" fill="#863bff" />
    
    <!-- Contact Info / Website -->
    <text x="0" y="420" font-family="Arial, sans-serif" font-size="24" fill="#863bff" font-weight="600">tabrani-company-profile.vercel.app</text>
  </g>
  
  <!-- Right Side Decorative Elements -->
  <rect x="900" y="100" width="200" height="200" fill="#863bff" fill-opacity="0.05" transform="rotate(45, 1000, 200)" />
  <rect x="950" y="300" width="150" height="150" fill="#47bfff" fill-opacity="0.05" transform="rotate(30, 1025, 375)" />
</svg>
